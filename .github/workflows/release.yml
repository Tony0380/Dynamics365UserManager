name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Publish single-file executable
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamics365UserManager
          path: ./publish/Dynamics365UserManager.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/Dynamics365UserManager.exe
          generate_release_notes: true
